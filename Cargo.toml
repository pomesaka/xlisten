[package]
name = "xlisten"
version = "0.1.0"
description = "Transcribes the microphone and the sound of meeting apps on this Mac into files an agent reads"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
block2 = "0.6.2"
cpal = "0.18.2"
ctrlc = { version = "3.5.2", features = ["termination"] }
hound = "3.5.1"
objc2 = "0.6.5"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
serde_json = "1.0.154"
whisper-rs = { version = "=0.16.0", features = ["metal"] }

[lints.rust]
# Only the bindings of C (src/speech.rs, src/tap.rs) are unsafe; each says so with an `allow`.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
debug = false
