[project]
name = "xlisten"
version = "0.1.0"
description = "Transcribes the microphone and the sound of meeting apps on this Mac into files an agent reads"
requires-python = ">=3.12,<3.13"
dependencies = [
  # The process tap of Core Audio (AudioHardwareCreateProcessTap), macOS 14.2 and later.
  "catap==0.6.0",
  "numpy==2.3.4",
  # The microphone, through PortAudio (the wheel carries its own libportaudio).
  "sounddevice==0.5.3",
]

[project.scripts]
xlisten = "xlisten.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==8.4.2"]
