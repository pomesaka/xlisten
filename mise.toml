[tools]
# Builds whisper.cpp (scripts/build-whisper.sh). The same version XmoQ pins.
cmake = "4.4.4"
# Keeps Python and every package in .venv of this folder; the version of Python is .python-version.
uv = "0.11.21"

[tasks.whisper]
description = "Build whisper-server of whisper.cpp into .cache/whisper.cpp (once; again when the version in the script changes)"
run = "scripts/build-whisper.sh"

[tasks.speech]
description = "Build speech of speech.cpp into .cache/speech.cpp and fetch the GGUF of RE-USE into .cache/models (once)"
run = "scripts/build-speech.sh"

[tasks.listen]
description = "Transcribe the microphone and the sound of the meeting apps into a folder: mise run listen -- --out ~/xlisten/<name>"
run = "uv run xlisten"
