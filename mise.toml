# Rust is not listed here: rust-toolchain.toml pins it, as XmoQ does.
[tools]
# Builds speech.cpp (scripts/build-speech.sh), and whisper.cpp in the build script of
# whisper-rs-sys. The same version XmoQ pins.
cmake = "4.4.4"

[tasks.speech]
description = "Build speech.cpp into .cache/speech.cpp and fetch RE-USE and Nemotron 3 Diarization into .cache/models (once)"
run = "scripts/build-speech.sh"

[tasks.listen]
description = "Transcribe the microphone and the sound of the apps into a folder: mise run listen -- --out ~/xlisten/<name>"
run = "cargo run --release --locked --quiet -- listen"

[tasks.check]
description = "cargo fmt --check, clippy and test"
run = ["cargo fmt --check", "cargo clippy --release --locked --all-targets -- -D warnings", "cargo test --release --locked"]
